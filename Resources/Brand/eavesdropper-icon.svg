<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- macOS Squircle Clip Path -->
    <clipPath id="squircle-clip">
      <path d="M 0,256 C 0,56 56,0 256,0 S 512,56 512,256 456,512 256,512 0,456 0,256 Z" />
    </clipPath>

    <!-- Dark slate background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#23272E" />
      <stop offset="100%" stop-color="#14171A" />
    </linearGradient>

    <!-- Inner rim highlight -->
    <linearGradient id="inner-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>

    <!-- macOS Electric Cyan -->
    <linearGradient id="cyan-accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Squircle background -->
  <g clip-path="url(#squircle-clip)">
    <rect width="512" height="512" fill="url(#bg-grad)" />

    <!-- 1px macOS edge stroke -->
    <path d="M 0,256 C 0,56 56,0 256,0 S 512,56 512,256 456,512 256,512 0,456 0,256 Z" fill="none" stroke="url(#inner-rim)" stroke-width="2" />

    <!-- Ear + 3 audio waves -->
    <g>
      <!-- Tabler ear icon, shifted left for balance with waves -->
      <g transform="translate(108, 204) scale(4.8)" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 10a7 7 0 1 1 13 3.6a10 10 0 0 1 -2 2a8 8 0 0 0 -2 3a4.5 4.5 0 0 1 -6.8 1.4" />
        <path d="M10 10a3 3 0 1 1 5 2.2" />
      </g>

      <!-- 3 audio waves (radii: 75px, 125px, 175px) -->
      <g fill="none" stroke-linecap="round" stroke-width="22">
        <path d="M 235 203 A 75 75 0 0 1 235 309" stroke="url(#cyan-accent)" />
        <path d="M 282 172 A 125 125 0 0 1 282 340" stroke="#FFFFFF" stroke-opacity="0.9" />
        <path d="M 328 141 A 175 175 0 0 1 328 371" stroke="#FFFFFF" stroke-opacity="0.75" />
      </g>
    </g>
  </g>
</svg>
